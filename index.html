<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jussi Virta: CV ja digipalvelut pienille yrityksille Mäntsälässä ja etänä koko Suomessa.">
  <title>Jussi Virta – digipalvelut yrityksille Mäntsälässä ja CV</title>
  <link rel="canonical" href="https://jussivirta.fi/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23FFE3EC%22%2F%3E%3Ctext%20x%3D%2216%22%20y%3D%2223%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2220%22%20font-weight%3D%22700%22%20fill%3D%22%23C8372F%22%3EJ%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="preload" href="/fontit/atkinson-hyperlegible-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fontit/caveat-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(/fontit/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(/fontit/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Caveat;font-weight:600;font-display:swap;src:url(/fontit/caveat-latin-600-normal.woff2) format("woff2")}
/* Ruutuvihkon sivu, jolla kaksi valintaa: Digipalvelut on muistilappu ja CV teipattu valokuva. Sama ilme kuin /digipalvelut-sivulla. */
:root{
  --pap:#FCFCFA; --grid:#D6E4EF; --pen:#33383E; --soft:#5E656C; --red:#C8372F; --note:#FFE3EC; --hl:#A8E6C8; --card:#FFFFFF; --tape:rgba(210,200,170,.62);
  --text:"Atkinson Hyperlegible",Verdana,system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:Caveat,"Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{margin:0;background:var(--pap);color:var(--pen);font-family:var(--text);font-size:17px;line-height:1.6}
.sq{background-color:var(--pap);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.hand{font-family:var(--hand);font-weight:600}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:4px;border-radius:4px}

.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font-size:32px;line-height:1}
header small{color:var(--soft);font-size:15px}
main{flex:1;display:flex;align-items:center}
main .wrap{width:100%;padding-block:32px 72px}

.pick{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.pick>a{min-width:0}
.choice{display:block;text-decoration:none;color:inherit;position:relative;transition:transform .2s ease,box-shadow .2s ease}
.choice .go{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--pen);color:var(--pap);font-weight:700;font-size:16px;padding:11px 18px;border-radius:8px}
.choice .go svg{transition:transform .2s ease}
.choice:hover .go svg,.choice:focus-visible .go svg{transform:translateX(4px)}
.choice .url{display:block;margin-top:10px;font-size:14px;color:var(--soft)}

.cv{background:var(--card);padding:14px 14px 26px;box-shadow:0 10px 24px rgba(0,0,0,.14);transform:rotate(2deg);max-width:360px;justify-self:center;width:100%;order:2}
.cv::before{content:"";position:absolute;top:-12px;left:36%;width:30%;height:24px;background:var(--tape);transform:rotate(-3deg)}
.cv .ph{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}
.cv img{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%}
.cv .tag{font-size:26px;line-height:1;color:var(--soft)}
.cv b{display:block;font-size:40px;line-height:48px;letter-spacing:-.01em}
.cv p{margin:0;font-size:15.5px;color:var(--soft);line-height:1.45}
.cv:hover{transform:rotate(1deg) translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.16)}

.dp{background:var(--note);padding:26px 26px 24px;box-shadow:0 10px 24px rgba(0,0,0,.14);transform:rotate(-2deg);max-width:360px;justify-self:center;width:100%;order:1}
.dp .tag{font-size:26px;line-height:1;color:var(--soft)}
.dp b{display:block;font-size:40px;line-height:48px;letter-spacing:-.01em}
.dp p{margin:0;font-size:15.5px;color:var(--soft);line-height:1.45}
.dp .price{font-size:30px;line-height:1;color:var(--red);margin-top:10px}
.dp:hover{transform:rotate(-1deg) translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.16)}

footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;padding-block:20px 28px;color:var(--soft);font-size:14px;border-top:1px solid var(--grid)}
footer a{color:inherit}

@media (max-width:760px){
      .pick{grid-template-columns:1fr;gap:44px}
  .cv,.dp{justify-self:start;max-width:340px}
}
@media (max-width:380px){.cv .ph{grid-template-columns:96px 1fr}.cv b,.dp b{font-size:34px;line-height:40px}}
@media (prefers-reduced-motion:reduce){.choice,.choice .go svg{transition:none}}

/* Salaperäinen piirtäjä (/doodle/doodle.js): piirrokset ruutupaperin päällä mutta sisällön alla. */
#doodles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
#doodles .piirros{fill:none;stroke:#1B1D20;stroke-opacity:.9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .6s ease}
#doodles .piirros.pois{opacity:0}
#doodles .kyna{opacity:0;transition:opacity .4s ease}
#doodles .kyna.nakyy{opacity:1}
header,main,footer{position:relative;z-index:1}
/* Kävijän kynä: punainen kuulakärki, jotta kävijän ja piirtäjän viivat erottuvat. Korttien päällä tavallinen osoitin. */
#doodles .kavija{fill:none;stroke:var(--red);stroke-width:3;stroke-opacity:.9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .6s ease}
#doodles .kavija.pois{opacity:0}
.voi-piirtaa .page{cursor:url(/doodle/kyna.svg) 3 29,crosshair}
.voi-piirtaa header .wrap>*,.voi-piirtaa footer .wrap>*{cursor:auto}
.voi-piirtaa .choice,.voi-piirtaa a,.voi-piirtaa button{cursor:pointer}
.ohjaimet{display:inline-flex;align-items:baseline;gap:14px;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s}
.ohjaimet.nakyy{opacity:1;visibility:visible}
.ohjaimet .vihje{font-size:21px;line-height:1;color:var(--pen)}
.ohjaimet button{background:none;border:0;padding:0;font:inherit;color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.ohjaimet button:hover{color:var(--pen)}
@media print{#doodles{display:none}}
</style>
</head>
<body>
<div class="page sq">
  <header><div class="wrap">
    <span class="logo hand">Jussi Virta</span>
    <small>Mäntsälä</small>
  </div></header>

  <main><div class="wrap">
    <h1 class="vh">Jussi Virta: CV ja digipalvelut</h1>

    <div class="pick">
      <a class="choice cv" href="/CV/">
        <div class="ph">
          <img src="/assets/jussi-portaali.jpg" width="400" height="560" alt="Jussi Virta">
          <div>
            <span class="tag hand">Työnantajille</span>
            <b>CV</b>
            <p>Työkokemus, osaaminen ja koulutus.</p>
          </div>
        </div>
        <span class="go">Avaa CV <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>

      <a class="choice dp" href="/digipalvelut/">
        <span class="tag hand">Yrityksille</span>
        <b>Digipalvelut</b>
        <p>Kotisivut, sisältöpäivitykset, Google-näkyvyys, mainonta ja tilakuvat.</p>
        <span class="go">Katso palvelut <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </div>
  </div></main>

  <footer><div class="wrap">
    <span>© 2026 Jussi Virta</span>
    <span>040 701 8708 · jussi@virta.net</span>
  </div></footer>
</div>
<script type="module" src="/doodle/doodle.js"></script>
</body>
</html>
